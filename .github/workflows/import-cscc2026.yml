name: Import CSCC 2026 GitLab Sources

on:
  push:
    branches:
      - import/cscc2026-sources
    paths:
      - '.github/workflows/import-cscc2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: import/cscc2026-sources

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Import public GitLab repositories
        shell: bash
        run: |
          set -u
          ROOT="research/2026-cscc-os/source"
          mkdir -p "$ROOT"
          REPORT="research/2026-cscc-os/IMPORT_STATUS.md"
          printf '# CSCC 2026 source import status\n\nGenerated by GitHub Actions.\n\n' > "$REPORT"

          import_repo() {
            name="$1"; shift
            dest="$ROOT/$name"
            rm -rf "$dest"
            ok=0
            used=""
            for url in "$@"; do
              [ -z "$url" ] && continue
              echo "Trying $name <- $url"
              if git clone --depth 1 --recurse-submodules --shallow-submodules "$url" "$dest"; then
                ok=1; used="$url"; break
              fi
              rm -rf "$dest"
            done
            if [ "$ok" -eq 0 ]; then
              printf -- '- ❌ `%s`: clone failed for all known candidate URLs.\n' "$name" >> "$REPORT"
              return 0
            fi

            # Remove nested Git histories while preserving source files, authorship notices and licenses.
            find "$dest" -name .git -type d -prune -exec rm -rf {} + 2>/dev/null || true
            find "$dest" -name .git -type f -delete 2>/dev/null || true

            # GitHub rejects blobs over 100 MiB. Keep a manifest and omit only those oversized artifacts.
            big_manifest="$dest/OMITTED_LARGE_FILES.txt"
            : > "$big_manifest"
            while IFS= read -r -d '' f; do
              sz=$(stat -c%s "$f" || echo 0)
              if [ "$sz" -gt 99000000 ]; then
                rel=${f#"$dest/"}
                printf '%s\t%s bytes\n' "$rel" "$sz" >> "$big_manifest"
                rm -f "$f"
              fi
            done < <(find "$dest" -type f -print0)
            [ -s "$big_manifest" ] || rm -f "$big_manifest"

            cat > "$dest/SOURCE_ORIGIN.md" <<EOF
          # Source origin

          This directory is a source snapshot imported for study from the public CSCC/OS competition GitLab repository below.

          Original repository: $used

          The original repository's LICENSE/NOTICE/README files are preserved when present. Git history was intentionally removed during import; this snapshot must not be interpreted as original authorship by this repository owner.
          EOF

            git add "$dest" "$REPORT"
            if ! git diff --cached --quiet; then
              git commit -m "vendor(cscc2026): import $name"
              git push origin HEAD:import/cscc2026-sources
            fi
            printf -- '- ✅ `%s`: `%s`\n' "$name" "$used" >> "$REPORT"
          }

          import_repo "01-open-euler-step-by-step" \
            "https://gitlab.eduxiji.net/T2026102569910321/project3136859-386827.git"

          import_repo "02-sudo-win-the-cscc" \
            "https://gitlab.eduxiji.net/T2026102569910192/OSKernel2026-sudo_win_the_cscc.git" \
            "https://gitlab.eduxiji.net/T2026102569910192/oskernel2026-sudo_win_the_cscc.git"

          import_repo "03-memoryflex-llm-memory" \
            "https://gitlab.eduxiji.net/T2026104879911351/project3136859-389097.git"

          import_repo "04-you-only-live-once" \
            "https://gitlab.eduxiji.net/educg-group-43734-3136859/T2026102179910632-23.git"

          import_repo "05-agentmem-traceforce" \
            "https://gitlab.eduxiji.net/T2026101419911266/project3136859-389204.git" \
            "https://gitlab.eduxiji.net/T2026101419911266/proj47-AgentMem.git"

          import_repo "06-proj51-wuhan-textile" \
            "https://gitlab.eduxiji.net/T2026104959910737/project3136859-389105.git" \
            "https://gitlab.eduxiji.net/T2026104959910737/proj51.git"

          import_repo "07-xiaonanliang-wuhan-university" \
            "https://gitlab.eduxiji.net/educg-group-43501-3132633/T2026104869910817-342.git" \
            "https://gitlab.eduxiji.net/T2026104869910817/OSKernel2026-2026104869910817.git"

          import_repo "08-eureka-os" \
            "https://gitlab.eduxiji.net/T2026104869910817/OSKernel2026-Eureka.git" \
            "https://gitlab.eduxiji.net/educg-group-43501-3132633/OSKernel2026-Eureka.git"

          import_repo "09-taoyouce" \
            "https://gitlab.eduxiji.net/T202510359998209/2026os.git"

          import_repo "10-0xdeadbeef" \
            "https://gitlab.eduxiji.net/T2026102699910462/OSKernel2026-0xDEADBEEF.git" \
            "https://gitlab.eduxiji.net/educg-group-43501-3132633/T2026102699910462.git"

          import_repo "11-lebrondiddy" \
            "https://gitlab.eduxiji.net/educg-group-43501-3132633/T2026104229910571-2751.git"

          git add "$REPORT"
          if ! git diff --cached --quiet; then
            git commit -m "docs(cscc2026): record source import status"
            git push origin HEAD:import/cscc2026-sources
          fi
