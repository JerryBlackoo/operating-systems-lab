name: Import CSCC 2026 proj32 comparison sources

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'RUN: import CSCC 2026 proj32 sources'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Import proj32 source snapshots
        shell: bash
        run: |
          set -u
          ROOT="research/2026-cscc-os/proj32-comparison/sources"
          REPORT="research/2026-cscc-os/proj32-comparison/IMPORT_STATUS.md"
          mkdir -p "$ROOT"
          mkdir -p "$(dirname "$REPORT")"
          printf '# proj32 source import status\n\nGenerated by GitHub Actions from public competition repositories.\n\n' > "$REPORT"

          import_repo() {
            name="$1"; shift
            dest="$ROOT/$name"
            tmp="${dest}.tmp"
            rm -rf "$dest" "$tmp"
            ok=0
            used=""
            for url in "$@"; do
              [ -z "$url" ] && continue
              echo "Trying $name <- $url"
              if git clone --depth 1 --recurse-submodules --shallow-submodules "$url" "$tmp"; then
                ok=1
                used="$url"
                break
              fi
              rm -rf "$tmp"
            done

            if [ "$ok" -eq 0 ]; then
              printf -- '- ❌ `%s`: clone failed for all candidate URLs.\n' "$name" >> "$REPORT"
              return 0
            fi

            mv "$tmp" "$dest"
            find "$dest" -name .git -type d -prune -exec rm -rf {} + 2>/dev/null || true
            find "$dest" -name .git -type f -delete 2>/dev/null || true

            big_manifest="$dest/OMITTED_LARGE_FILES.txt"
            : > "$big_manifest"
            while IFS= read -r -d '' f; do
              sz=$(stat -c%s "$f" 2>/dev/null || echo 0)
              if [ "$sz" -gt 99000000 ]; then
                rel=${f#"$dest/"}
                printf '%s\t%s bytes\n' "$rel" "$sz" >> "$big_manifest"
                rm -f "$f"
              fi
            done < <(find "$dest" -type f -print0)
            [ -s "$big_manifest" ] || rm -f "$big_manifest"

            cat > "$dest/SOURCE_ORIGIN.md" <<EOF
          # Source origin

          This directory is a source snapshot imported for comparative study of the 2026 CSCC OS `proj32` submissions.

          Original repository used for this snapshot: $used

          Git history was intentionally removed. Original LICENSE/NOTICE/README files are preserved when present. Copyright and authorship remain with the original project contributors.
          EOF

            git add "$dest" "$REPORT"
            if ! git diff --cached --quiet; then
              git commit -m "vendor(proj32): import $name"
              git push origin HEAD:main
            fi
            printf -- '- ✅ `%s`: `%s`\n' "$name" "$used" >> "$REPORT"
          }

          import_repo "01-mtagentlens" \
            "https://gitlab.eduxiji.net/educg-group-43734-3136859/T202690002999777-3686.git" \
            "https://gitlab.eduxiji.net/educg-group-48534-3136859/T202690002999777-1109.git" \
            "https://github.com/LiuZhouKang/MtAgentLens.git"

          import_repo "02-guangming-weilai" \
            "https://gitlab.eduxiji.net/educg-group-48534-3136859/T2026900029910646-1053.git"

          import_repo "03-sange-zhugeliang" \
            "https://gitlab.eduxiji.net/educg-group-48534-3136859/T2026900029911547-534.git" \
            "https://gitlab.eduxiji.net/educg-group-48534-3136859/T2026900029911547-482.git"

          import_repo "04-danji-shuru-wenben" \
            "https://gitlab.eduxiji.net/educg-group-48534-3136859/T2026120269910095-2286.git" \
            "https://gitlab.eduxiji.net/T2026120269910095/project3136859-382916.git"

          import_repo "05-yuanwei-moli" \
            "https://gitlab.eduxiji.net/educg-group-48534-3136859/T2026104869910476-2464.git" \
            "https://gitlab.eduxiji.net/educg-group-43734-3136859/T2026104869910476-3357.git"

          git add "$REPORT"
          if ! git diff --cached --quiet; then
            git commit -m "docs(proj32): record import status"
            git push origin HEAD:main
          fi
