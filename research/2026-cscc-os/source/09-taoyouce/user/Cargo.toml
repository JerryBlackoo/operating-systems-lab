[package]
name = "user"
version = "0.1.0"
edition = "2021"
authors = ["RustMicroOS Team"]
description = "RustMicroOS 用户空间库和应用程序"

[dependencies]

[features]
default = []

# 用户程序列表
[[bin]]
name = "init"
path = "src/bin/init.rs"

[[bin]]
name = "sh"
path = "src/bin/sh.rs"

[[bin]]
name = "echo"
path = "src/bin/echo.rs"

[[bin]]
name = "ls"
path = "src/bin/ls.rs"

[[bin]]
name = "cat"
path = "src/bin/cat.rs"

[[bin]]
name = "help"
path = "src/bin/help.rs"

[[bin]]
name = "ps"
path = "src/bin/ps.rs"

[[bin]]
name = "pwd"
path = "src/bin/pwd.rs"

[[bin]]
name = "sysinfo"
path = "src/bin/sysinfo.rs"

[profile.release]
debug = false
opt-level = "z"
lto = true
